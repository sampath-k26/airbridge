[package]
name = "airbridge"
version = "2.0.0"
edition = "2021"
description = "AirBridge: Native AirDrop ↔ Quick Share bridge for macOS and Android with on-demand lifecycle and hotspot support"
license = "GPL-3.0-only"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
base64 = "0.23"
flate2 = "1.0"
hkdf = "0.12"
libc = "0.2"
log = "0.4"
mdns-sd = { git = "https://github.com/Martichou/mdns-sd", branch = "unsolicited" }
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
plist = "1.7"
qrcode = { version = "0.14", default-features = false }
rqs_lib = { git = "https://github.com/Martichou/rquickshare", rev = "378d8ae969941bee4bf60ad34ac9cf8bb7005eb7", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal", "fs", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
