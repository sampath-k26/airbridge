name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security problems:** please do not open a public issue; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Phone model and Android version
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Phone hotspot 5 GHz, Phone hotspot 2.4 GHz, Home Wi-Fi / router, Other]
  - type: input
    id: version
    attributes:
      label: AirBridge version
      placeholder: "1.1.0"
