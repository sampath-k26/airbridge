name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Install Protoc
        run: brew install protobuf
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build Apple Silicon (arm64)
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Build Intel (x86_64)
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Package Binaries
        run: |
          mkdir -p dist
          lipo -create -output dist/airbridge target/aarch64-apple-darwin/release/airbridge target/x86_64-apple-darwin/release/airbridge
          
          tar -czf dist/airbridge-macos-arm64.tar.gz -C target/aarch64-apple-darwin/release airbridge
          tar -czf dist/airbridge-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release airbridge
          tar -czf dist/airbridge-macos.tar.gz -C dist airbridge
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/airbridge-macos.tar.gz
            dist/airbridge-macos-arm64.tar.gz
            dist/airbridge-macos-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
